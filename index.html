<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0F1119">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #0F1119; --surface: #1A1D2B; --surface-hover: #232738;
    --border: #2A2E3F; --accent: #3B82F6; --accent-dark: #2563EB;
    --success: #10B981; --warn: #F59E0B; --danger: #EF4444;
    --text: #F1F5F9; --text-muted: #94A3B8; --text-dim: #64748B;
    --personal: #8B5CF6; --work: #3B82F6;
    color-scheme: dark;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  input[type="range"] { height: 6px; }
  ::-webkit-scrollbar { display: none; }
  @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.8; } }
  #root { min-height: 100vh; }
</style>

<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Constants ───
const CATEGORIES = ["Fuel", "Maintenance", "Insurance", "Repairs", "Registration"];
const ENTRY_SOURCES = ["manual", "voice", "recovery"];
const SPLIT_METHODS = ["all_work", "all_personal", "percentage"];
const PREMIUM_PRICE = "$29.99/year";
const PREMIUM_LAUNCH_PRICE = "$19.99/year";
const PREMIUM_FEATURES = [
  "Tax-Ready Reports with deductible calculations",
  "Gap Recovery for missed days",
  "Accountant CSV & PDF exports",
  "Multi-vehicle support",
];
const ACTIVE_COUNTRY = "canada";

// ─── Tax Rules Engine ───
const taxRules = {
  canada: {
    id: "canada", label: "Canada", currency: "$", distanceUnit: "km", locale: "en-CA",
    methods: [{ id: "actual_cost", label: "Actual Cost (Business-Use %)" }],
    defaultMethod: "actual_cost",
    categories: [...CATEGORIES],
    labels: { distanceUnit: "km", businessPctLabel: "Business Use", deductibleLabel: "Estimated Deductible", reportTitle: "Tax Ready Report", summaryTitle: "Tax Summary" },
    formatMoney: (n) => `$${Number(n).toFixed(2)}`,
    calculate: (_method, { workKm, personalKm, totalKm, expenses }) => {
      const businessUsePct = totalKm > 0 ? workKm / totalKm : 0;
      const byCategory = {};
      CATEGORIES.forEach((c) => {
        const actual = expenses[c] || 0;
        byCategory[c] = { actual: Math.round(actual * 100) / 100, deductible: Math.round(actual * businessUsePct * 100) / 100 };
      });
      const totalExpenses = Math.round(Object.values(byCategory).reduce((s, v) => s + v.actual, 0) * 100) / 100;
      const totalDeductible = Math.round(Object.values(byCategory).reduce((s, v) => s + v.deductible, 0) * 100) / 100;
      return { businessUsePct, byCategory, totalExpenses, totalDeductible, extras: {} };
    },
  },
};

const getActiveTaxRules = () => taxRules[ACTIVE_COUNTRY];

// ─── Utility Helpers ───
const genId = () => crypto.randomUUID?.() || Math.random().toString(36).slice(2);
const fmt = (n) => n?.toLocaleString?.("en-CA") ?? n;
const fmtDate = (d) => new Date(d).toLocaleDateString("en-CA");
const fmtMoney = (n) => `$${Number(n).toFixed(2)}`;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// ─── Default State ───
const defaultSettings = () => ({
  default_trip_type: "work", daily_distance_threshold: 300,
  reminder_morning: "07:00", reminder_evening: "17:30",
  reminder_days: "weekdays", distance_unit: "km",
});
const defaultUserData = () => ({
  settings: defaultSettings(),
  vehicle: { vehicle_id: genId(), vehicle_name: "My Vehicle" },
  logs: [], expenses: [], gapAllocations: [],
  onboarded: false, isPro: false,
});

// ─── Persistence ───
const STORAGE_KEY = "kmsnap_data";
const loadData = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...defaultUserData(), ...parsed, settings: { ...defaultSettings(), ...parsed.settings } };
    }
  } catch {}
  return defaultUserData();
};
const saveData = (data) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} };

// ─── Theme ───
const theme = {
  bg: "#0F1119", surface: "#1A1D2B", surfaceHover: "#232738",
  border: "#2A2E3F", accent: "#3B82F6", accentDark: "#2563EB",
  success: "#10B981", warn: "#F59E0B", danger: "#EF4444",
  text: "#F1F5F9", textMuted: "#94A3B8", textDim: "#64748B",
  personal: "#8B5CF6", work: "#3B82F6",
};
const baseBtn = {
  border: "none", borderRadius: 14, cursor: "pointer", fontWeight: 600,
  fontFamily: "'DM Sans', sans-serif", transition: "all 0.15s ease",
  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
};

// ─── Icons ───
const Icon = ({ d, size = 24, color = "currentColor", strokeWidth = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);
const Icons = {
  gauge: (p) => <Icon {...p} d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2" />,
  mic: (p) => <Icon {...p} d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" />,
  camera: (p) => <Icon {...p} d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />,
  chart: (p) => <Icon {...p} d="M18 20V10M12 20V4M6 20v-6" />,
  settings: (p) => <Icon {...p} d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />,
  check: (p) => <Icon {...p} d="M20 6L9 17l-5-5" />,
  x: (p) => <Icon {...p} d="M18 6L6 18M6 6l12 12" />,
  alert: (p) => <Icon {...p} d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />,
  back: (p) => <Icon {...p} d="M19 12H5M12 19l-7-7 7-7" />,
  plus: (p) => <Icon {...p} d="M12 5v14M5 12h14" />,
  download: (p) => <Icon {...p} d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
  lock: (p) => <Icon {...p} d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4" />,
  star: (p) => <Icon {...p} d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />,

// ─── KmSnap Logo ───
const KmSnapLogo = ({ size = 64 }) => {
  const s = size, half = s / 2, r = half * 0.82;
  const needleLen = r * 0.58, angle = -30, rad = (angle * Math.PI) / 180;
  const nx = half + Math.sin(rad) * needleLen, ny = half - Math.cos(rad) * needleLen;
  const ticks = [];
  for (let i = 0; i <= 6; i++) {
    const a = (210 - i * 40) * (Math.PI / 180);
    ticks.push({ x1: half + Math.cos(a) * (r * 0.88), y1: half - Math.sin(a) * (r * 0.88), x2: half + Math.cos(a) * r, y2: half - Math.sin(a) * r, major: i % 2 === 0 });
  }
  return (
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} fill="none">
      <circle cx={half} cy={half} r={r} stroke="#3B82F6" strokeWidth={s * 0.04} strokeLinecap="round" opacity={0.25} />
      <path d={`M ${half + Math.cos(210 * Math.PI / 180) * r} ${half - Math.sin(210 * Math.PI / 180) * r} A ${r} ${r} 0 1 1 ${half + Math.cos(-30 * Math.PI / 180) * r} ${half - Math.sin(-30 * Math.PI / 180) * r}`} stroke="#3B82F6" strokeWidth={s * 0.04} strokeLinecap="round" fill="none" />
      {ticks.map((t, i) => <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke={t.major ? "#F1F5F9" : "#64748B"} strokeWidth={t.major ? s * 0.03 : s * 0.018} strokeLinecap="round" />)}
      <line x1={half} y1={half} x2={nx} y2={ny} stroke="#3B82F6" strokeWidth={s * 0.04} strokeLinecap="round" />
      <circle cx={half} cy={half} r={s * 0.05} fill="#3B82F6" />
      <text x={half} y={half + r * 0.48} textAnchor="middle" fill="#3B82F6" fontSize={s * 0.18} fontFamily="'Space Mono', monospace" fontWeight="700">km</text>
    </svg>
  );
};

const KmSnapIcon = ({ size = 20, color = "currentColor" }) => (

    <line x1="12" y1="12" x2={12 + Math.sin(-30 * Math.PI / 180) * 5.5} y2={12 - Math.cos(-30 * Math.PI / 180) * 5.5} stroke={color} strokeWidth="2" strokeLinecap="round" />
    <circle cx="12" cy="12" r="1.2" fill={color} />
    <text x="12" y="18.5" textAnchor="middle" fill={color} fontSize="5" fontFamily="'Space Mono', monospace" fontWeight="700">km</text>

);

// ─── Reusable Components ───
const Page = ({ children, style }) => (

);
const Header = ({ title, onBack, right }) => (

    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>

const Card = ({ children, style, onClick }) => (

    <div style={{ background: `${c}15`, border: `1px solid ${c}40`, borderRadius: 14, padding: 16, marginBottom: 16 }}>

        <p style={{ margin: 0, color: c, fontSize: 14, fontWeight: 600, lineHeight: 1.4 }}>{message}</p>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        {onFix && <button onClick={onFix} style={{ ...baseBtn, padding: "8px 16px", fontSize: 13, background: theme.surface, color: theme.text, border: `1px solid ${theme.border}` }}>Fix It</button>}
        {onRecovery && <button onClick={onRecovery} style={{ ...baseBtn, padding: "8px 16px", fontSize: 13, background: theme.surface, color: theme.warn, border: `1px solid ${theme.warn}40` }}>Log Gap</button>}
        {onConfirm && <button onClick={onConfirm} style={{ ...baseBtn, padding: "8px 16px", fontSize: 13, background: `${c}20`, color: c, border: `1px solid ${c}40` }}>Confirm</button>}
      </div>

  );
};
const ProBadge = ({ style }) => (

        <div style={{ width: 56, height: 56, borderRadius: 16, background: "#F59E0B18", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}><Icons.star size={28} color="#F59E0B" /></div>

      <button onClick={onClose} style={{ ...baseBtn, width: "100%", padding: "14px", fontSize: 14, background: "none", color: theme.textMuted, border: `1px solid ${theme.border}` }}>Maybe Later</button>

// ─── Onboarding ───
const Onboarding = ({ onComplete }) => {
  const [step, setStep] = useState(0);
  const [name, setName] = useState("");
  const [vehicleName, setVehicleName] = useState("");
  const [defaultType, setDefaultType] = useState("work");
  const [odometer, setOdometer] = useState("");
  const steps = [
    <div key={0} style={{ textAlign: "center", padding: "60px 20px" }}>
      <KmSnapLogo size={80} />
      <h1 style={{ fontSize: 32, fontWeight: 800, color: theme.text, margin: "16px 0 12px", fontFamily: "'Space Mono', monospace" }}>KmSnap</h1>
      <p style={{ color: theme.textMuted, fontSize: 16, lineHeight: 1.6, margin: "0 0 40px" }}>Log km's in seconds.<br />Simple km tracker for busy drivers.</p>
      <button onClick={() => setStep(1)} style={{ ...baseBtn, background: theme.accent, color: "#fff", padding: "16px 48px", fontSize: 16, width: "100%" }}>Get Started</button>
    </div>,
    <div key={1} style={{ padding: "40px 0" }}>
      <h2 style={{ fontSize: 22, color: theme.text, margin: "0 0 8px", fontFamily: "'Space Mono', monospace" }}>Quick Setup</h2>
      <p style={{ color: theme.textMuted, fontSize: 14, margin: "0 0 28px" }}>Takes 30 seconds. That's it.</p>
      <Input label="Your Name" value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" />
      <Input label="Vehicle Name" value={vehicleName} onChange={(e) => setVehicleName(e.target.value)} placeholder="e.g. 2019 Ram 1500" />
      <Input label="Current Odometer" value={odometer} onChange={(e) => setOdometer(e.target.value.replace(/\D/g, ""))} placeholder="e.g. 42315" type="tel" />
      <div style={{ marginBottom: 14 }}>
        <label style={{ display: "block", fontSize: 12, color: theme.textMuted, marginBottom: 8, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>Default Trip Type</label>
        <div style={{ display: "flex", gap: 8 }}>
          <Chip label="Work" active={defaultType === "work"} onClick={() => setDefaultType("work")} color={theme.work} />
          <Chip label="Personal" active={defaultType === "personal"} onClick={() => setDefaultType("personal")} color={theme.personal} />

      <button onClick={() => { if (!odometer) return; onComplete({ name: name || "Driver", vehicleName: vehicleName || "My Vehicle", defaultType, initialOdometer: parseInt(odometer) }); }} disabled={!odometer}
        style={{ ...baseBtn, background: odometer ? theme.accent : theme.border, color: odometer ? "#fff" : theme.textDim, padding: "16px", fontSize: 16, width: "100%", marginTop: 16 }}>Start Tracking</button>
    </div>,
  ];
  return <Page>{steps[step]}</Page>;
};

// ─── Voice Logger ───
const VoiceLogger = ({ onResult, onClose }) => {
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [parsed, setParsed] = useState(null);
  const [error, setError] = useState(null);
  const recognitionRef = useRef(null);
  const parseVoice = (text) => {
    const clean = text.toLowerCase().replace(/,/g, "").trim();
    const numMatch = clean.match(/(\d+)/);
    if (!numMatch) return null;
    const odometer = parseInt(numMatch[1]);
    let tripType = null;
    if (/work|business|job/i.test(clean)) tripType = "work";
    else if (/personal|private|home/i.test(clean)) tripType = "personal";
    return { odometer, tripType };
  };
  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setError("Voice not supported in this browser. Try Chrome on Android, or Safari on iPhone."); return; }
    const recognition = new SR();
    recognition.continuous = false; recognition.interimResults = true; recognition.lang = "en-US";
    recognition.onresult = (e) => { const t = Array.from(e.results).map((r) => r[0].transcript).join(""); setTranscript(t); if (e.results[0]?.isFinal) { setParsed(parseVoice(t)); setListening(false); } };
    recognition.onerror = (e) => { setError(`Voice error: ${e.error}. Make sure you allowed microphone access.`); setListening(false); };
    recognition.onend = () => setListening(false);
    recognitionRef.current = recognition; recognition.start(); setListening(true); setTranscript(""); setParsed(null); setError(null);
  };
  const stopListening = () => { recognitionRef.current?.stop(); setListening(false); };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 1000, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <button onClick={onClose} style={{ position: "absolute", top: 20, right: 20, ...baseBtn, background: "none", color: theme.textMuted, padding: 8 }}><Icons.x size={24} /></button>
      <div style={{ textAlign: "center", maxWidth: 360, width: "100%" }}>
        <div style={{ marginBottom: 32 }}>
          <div onClick={listening ? stopListening : startListening} style={{ width: 120, height: 120, borderRadius: "50%", background: listening ? `${theme.danger}30` : `${theme.accent}20`, border: `3px solid ${listening ? theme.danger : theme.accent}`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto", cursor: "pointer", animation: listening ? "pulse 1.5s infinite" : "none" }}>
            <Icons.mic size={48} color={listening ? theme.danger : theme.accent} />
          </div>
        </div>
        <p style={{ color: theme.textMuted, fontSize: 16, marginBottom: 20 }}>{listening ? "Listening..." : error ? error : 'Tap mic, then say: "42,315 work"'}</p>
        {transcript && <Card style={{ marginBottom: 16, textAlign: "left" }}><p style={{ color: theme.textDim, fontSize: 12, margin: "0 0 4px", textTransform: "uppercase" }}>Heard</p><p style={{ color: theme.text, fontSize: 18, margin: 0, fontFamily: "'Space Mono', monospace" }}>{transcript}</p></Card>}
        {parsed && (
          <div>
            <Card style={{ marginBottom: 16, textAlign: "left" }}><p style={{ color: theme.textDim, fontSize: 12, margin: "0 0 4px", textTransform: "uppercase" }}>Parsed</p><p style={{ color: theme.text, fontSize: 24, margin: "0 0 4px", fontFamily: "'Space Mono', monospace" }}>{fmt(parsed.odometer)}</p>{parsed.tripType && <span style={{ fontSize: 13, color: parsed.tripType === "work" ? theme.work : theme.personal, fontWeight: 600, textTransform: "uppercase" }}>{parsed.tripType}</span>}</Card>
            <button onClick={() => onResult(parsed)} style={{ ...baseBtn, background: theme.success, color: "#fff", padding: "14px 32px", fontSize: 15, width: "100%" }}><Icons.check size={18} /> Use This Reading</button>
          </div>
        )}
      </div>
    </div>
  );
};

// ─── Gap Recovery Modal ───
const GapRecovery = ({ gapKm, gapDays, lastDate, onSave, onClose }) => {
  const [method, setMethod] = useState("all_work");
  const [workPct, setWorkPct] = useState(80);
  const calcSplit = () => {
    if (method === "all_work") return { work_km: gapKm, personal_km: 0 };
    if (method === "all_personal") return { work_km: 0, personal_km: gapKm };
    return { work_km: Math.round(gapKm * workPct / 100), personal_km: Math.round(gapKm * (100 - workPct) / 100) };
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 1000, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: theme.bg, borderRadius: "24px 24px 0 0", padding: "28px 24px 40px", maxWidth: 480, width: "100%", maxHeight: "80vh", overflow: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <h2 style={{ color: theme.text, fontSize: 20, margin: 0, fontFamily: "'Space Mono', monospace" }}>Missed Days</h2>
          <button onClick={onClose} style={{ ...baseBtn, background: "none", color: theme.textMuted, padding: 4 }}><Icons.x size={20} /></button>
        </div>
        <Card style={{ marginBottom: 20, background: `${theme.warn}10`, border: `1px solid ${theme.warn}30` }}>
          <p style={{ color: theme.warn, fontSize: 14, margin: 0, fontWeight: 600 }}>{gapDays} unlogged day{gapDays > 1 ? "s" : ""} · {fmt(gapKm)} km unaccounted</p>
          <p style={{ color: theme.textMuted, fontSize: 12, margin: "4px 0 0" }}>Since {fmtDate(lastDate)}</p>
        </Card>
        <p style={{ color: theme.textMuted, fontSize: 13, margin: "0 0 12px" }}>How should this distance be split?</p>
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          <Chip label="All Work" active={method === "all_work"} onClick={() => setMethod("all_work")} color={theme.work} />
          <Chip label="All Personal" active={method === "all_personal"} onClick={() => setMethod("all_personal")} color={theme.personal} />
          <Chip label="Split %" active={method === "percentage"} onClick={() => setMethod("percentage")} color={theme.accent} />
        </div>
        {method === "percentage" && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: theme.work, fontSize: 14, fontWeight: 600 }}>Work {workPct}%</span>
              <span style={{ color: theme.personal, fontSize: 14, fontWeight: 600 }}>Personal {100 - workPct}%</span>
            </div>
            <input type="range" min={0} max={100} step={5} value={workPct} onChange={(e) => setWorkPct(parseInt(e.target.value))} style={{ width: "100%", accentColor: theme.accent }} />
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
              <span style={{ color: theme.textDim, fontSize: 13 }}>{fmt(calcSplit().work_km)} km</span>
              <span style={{ color: theme.textDim, fontSize: 13 }}>{fmt(calcSplit().personal_km)} km</span>
            </div>
          </div>
        )}
        <button onClick={() => onSave({ ...calcSplit(), split_method: method })} style={{ ...baseBtn, background: theme.accent, color: "#fff", padding: "14px", fontSize: 15, width: "100%" }}>Save Allocation</button>
      </div>
    </div>
  );
};

// ─── Main App ───
function KMSnap() {
  const [data, setData] = useState(loadData);
  const [screen, setScreen] = useState("dashboard");
  const [showVoice, setShowVoice] = useState(false);
  const [showGap, setShowGap] = useState(null);
  const [quickLogState, setQuickLogState] = useState({ odometer: "", tripType: null, anomaly: null, anomalyConfirmed: false });
  const [expenseForm, setExpenseForm] = useState({ category: "Fuel", amount: "", note: "", date: new Date().toISOString().split("T")[0], receiptPreview: null });
  const [toast, setToast] = useState(null);
  const [showPaywall, setShowPaywall] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  const isPro = data.isPro;
  const requirePro = (action) => { if (isPro) { action(); return; } setShowPaywall(true); };
  const handleUpgrade = () => { update((d) => { d.isPro = true; }); setShowPaywall(false); showToastMsg("Pro unlocked!"); };

  useEffect(() => { saveData(data); }, [data]);

  const update = (fn) => setData((prev) => { const next = { ...prev }; fn(next); return next; });
  const showToastMsg = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  const lastLog = data.logs.length > 0 ? data.logs[data.logs.length - 1] : null;
  const prevOdometer = lastLog?.odometer ?? null;

  const currentYear = new Date().getFullYear();
  const yearLogs = data.logs.filter((l) => new Date(l.date).getFullYear() === currentYear);
  const yearGaps = data.gapAllocations.filter((g) => new Date(g.gap_end_date).getFullYear() === currentYear);
  const workKm = yearLogs.filter((l) => l.trip_type === "work").reduce((s, l) => s + (l.distance_calculated || 0), 0) + yearGaps.reduce((s, g) => s + g.work_km, 0);
  const personalKm = yearLogs.filter((l) => l.trip_type === "personal").reduce((s, l) => s + (l.distance_calculated || 0), 0) + yearGaps.reduce((s, g) => s + g.personal_km, 0);
  const totalKm = workKm + personalKm;
  const workPct = totalKm > 0 ? Math.round((workKm / totalKm) * 100) : 0;

  const detectGap = () => {
    if (!lastLog) return null;
    const days = daysBetween(lastLog.date, new Date().toISOString().split("T")[0]);
    return days > 1 ? { days, lastDate: lastLog.date } : null;
  };
  const checkAnomaly = (currentOdo) => {
    if (prevOdometer === null) return null;
    if (currentOdo < prevOdometer) return { type: "block", message: `Odometer can't be lower than last reading (${fmt(prevOdometer)}).` };
    const dist = currentOdo - prevOdometer;
    const threshold = data.settings.daily_distance_threshold;
    if (dist > threshold * 3) return { type: "strong", message: `That's ${fmt(dist)} km — unusually high. Did you miss logging some days?` };
    if (dist > threshold) return { type: "warn", message: `That's ${fmt(dist)} km since last log. Confirm?` };
    return null;
  };
  const handleOdometerChange = (val) => {
    const num = val.replace(/\D/g, "");
    const odo = num ? parseInt(num) : null;
    const anomaly = odo ? checkAnomaly(odo) : null;
    setQuickLogState((s) => ({ ...s, odometer: num, anomaly, anomalyConfirmed: false }));
  };
  const saveLog = (source = "manual") => {
    const odo = parseInt(quickLogState.odometer);
    if (!odo) return;
    const tripType = quickLogState.tripType || data.settings.default_trip_type;
    const now = new Date();
    const log = {
      log_id: genId(), user_id: "local", vehicle_id: data.vehicle.vehicle_id,
      odometer: odo, previous_odometer: prevOdometer, distance_calculated: prevOdometer ? odo - prevOdometer : 0,
      entry_type: "manual", entry_source: source, trip_type: tripType,
      date: now.toISOString().split("T")[0], time: now.toISOString(),
      is_recovery: false, anomaly_confirmed: quickLogState.anomalyConfirmed,
    };
    update((d) => d.logs.push(log));
    setQuickLogState({ odometer: "", tripType: null, anomaly: null, anomalyConfirmed: false });
    showToastMsg(`Logged ${fmt(odo)} · ${tripType}`);
    setScreen("dashboard");
  };
  const handleVoiceResult = (parsed) => {
    setShowVoice(false);
    setQuickLogState({ odometer: String(parsed.odometer), tripType: parsed.tripType || data.settings.default_trip_type, anomaly: checkAnomaly(parsed.odometer), anomalyConfirmed: false });
    setScreen("log");
  };
  const handleGapSave = (split) => {
    const gap = detectGap();
    if (!gap) return;
    const currentOdo = parseInt(quickLogState.odometer);
    const gapKm = currentOdo && prevOdometer ? currentOdo - prevOdometer : 0;
    const allocation = { allocation_id: genId(), user_id: "local", vehicle_id: data.vehicle.vehicle_id, gap_start_date: gap.lastDate, gap_end_date: new Date().toISOString().split("T")[0], unlogged_km: gapKm, ...split };
    update((d) => d.gapAllocations.push(allocation));
    setShowGap(null);
    showToastMsg("Gap allocated");
  };
  const saveExpense = () => {
    if (!expenseForm.amount) return;
    const expense = { expense_id: genId(), user_id: "local", vehicle_id: data.vehicle.vehicle_id, category: expenseForm.category, amount: parseFloat(expenseForm.amount), note: expenseForm.note || "", receipt_image: expenseForm.receiptPreview, date: expenseForm.date };
    update((d) => d.expenses.push(expense));
    setExpenseForm({ category: "Fuel", amount: "", note: "", date: new Date().toISOString().split("T")[0], receiptPreview: null });
    showToastMsg("Expense saved");
    setScreen("dashboard");
  };
  const handleReceiptPhoto = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setExpenseForm((s) => ({ ...s, receiptPreview: ev.target.result }));
    reader.readAsDataURL(file);
  };
  const generateReport = () => {
    const rules = getActiveTaxRules();
    const yearExpenses = data.expenses.filter((e) => new Date(e.date).getFullYear() === currentYear);
    const expenseTotals = {};
    rules.categories.forEach((c) => { expenseTotals[c] = yearExpenses.filter((e) => e.category === c).reduce((s, e) => s + e.amount, 0); });
    const result = rules.calculate(rules.defaultMethod, { workKm, personalKm, totalKm, expenses: expenseTotals });
    return { workKm, personalKm, totalKm, workPct, ...result };
  };

  // ─── XLSX Export ───
  const downloadXLSX = (wb, filename) => {
    try {
      const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    } catch (e) { showToastMsg("Export failed — try again"); }
  };
  const colW = (widths) => widths.map((w) => ({ wch: w }));
  const headerStyle = { font: { bold: true, sz: 14, color: { rgb: "3B82F6" } } };
  const subHeaderStyle = { font: { sz: 10, color: { rgb: "64748B" } } };
  const sectionStyle = { font: { bold: true, sz: 12, color: { rgb: "F1F5F9" } }, fill: { fgColor: { rgb: "1A1D2B" } } };
  const colHeaderStyle = { font: { bold: true, sz: 10, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "3B82F6" } }, alignment: { horizontal: "center" } };
  const numStyle = { numFmt: "#,##0", alignment: { horizontal: "right" } };
  const moneyStyle = { numFmt: "$#,##0.00", alignment: { horizontal: "right" } };
  const pctStyle = { numFmt: "0.00%", alignment: { horizontal: "right" } };
  const altRow = { fill: { fgColor: { rgb: "F0F4FF" } } };
  const totalRowStyle = { font: { bold: true, sz: 11 }, fill: { fgColor: { rgb: "E8F0FE" } }, border: { top: { style: "thin", color: { rgb: "3B82F6" } } } };
  const deductibleStyle = { font: { bold: true, sz: 12, color: { rgb: "10B981" } }, fill: { fgColor: { rgb: "ECFDF5" } } };
  const footerStyle = { font: { italic: true, sz: 9, color: { rgb: "94A3B8" } } };
  const applyStyles = (ws, cellRef, style) => { if (!ws[cellRef]) ws[cellRef] = { v: "", t: "s" }; ws[cellRef].s = { ...ws[cellRef].s, ...style }; };

  const exportMileageXLSX = () => {
    try {
      const generated = new Date().toLocaleString("en-CA", { dateStyle: "long", timeStyle: "short" });
      const wb = XLSX.utils.book_new();
      const rows = [
        ["KmSnap Mileage Log"], [`Tax Year: ${currentYear}`], [`Generated: ${generated}`], [`Vehicle: ${data.vehicle.vehicle_name}`], [],
        ["MILEAGE SUMMARY"], ["", "Kilometres"], ["Total", totalKm], ["Business", workKm], ["Personal", personalKm], ["Trips Logged", yearLogs.length], [], [],
        ["TRIP LOG"], ["Date", "Odometer", "Distance (km)", "Trip Type"],
        ...yearLogs.map((l) => [l.date, l.odometer || 0, l.distance_calculated || 0, (l.trip_type || "").charAt(0).toUpperCase() + (l.trip_type || "").slice(1)]),
        [], [], ["Generated by KmSnap - Simple km tracker for busy drivers"],
      ];
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = colW([16, 14, 16, 14]);
      applyStyles(ws, "A1", headerStyle); applyStyles(ws, "A2", subHeaderStyle); applyStyles(ws, "A3", subHeaderStyle); applyStyles(ws, "A4", subHeaderStyle);
      applyStyles(ws, "A6", sectionStyle);
      for (let r = 7; r <= 11; r++) { applyStyles(ws, `A${r}`, { font: { bold: true } }); if (r >= 8 && r <= 10) applyStyles(ws, `B${r}`, numStyle); }
      applyStyles(ws, "A14", sectionStyle);
      ["A15", "B15", "C15", "D15"].forEach((c) => applyStyles(ws, c, colHeaderStyle));
      yearLogs.forEach((_, i) => {
        const r = 16 + i;
        if (i % 2 === 1) ["A", "B", "C", "D"].forEach((c) => applyStyles(ws, `${c}${r}`, altRow));
        applyStyles(ws, `B${r}`, { ...numStyle, ...(i % 2 === 1 ? altRow : {}) });
        applyStyles(ws, `C${r}`, { ...numStyle, ...(i % 2 === 1 ? altRow : {}) });
      });
      ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }, { s: { r: 5, c: 0 }, e: { r: 5, c: 3 } }, { s: { r: 13, c: 0 }, e: { r: 13, c: 3 } }];
      XLSX.utils.book_append_sheet(wb, ws, "Mileage Log");
      downloadXLSX(wb, `KmSnap_Mileage_${currentYear}.xlsx`);
      showToastMsg("Mileage report downloaded");
    } catch (e) { showToastMsg("Export failed"); }
  };

  const exportTaxReport = () => {
    try {
      const report = generateReport();
      const generated = new Date().toLocaleString("en-CA", { dateStyle: "long", timeStyle: "short" });
      const pctVal = report.businessUsePct;
      const yearExpenses = data.expenses.filter((e) => new Date(e.date).getFullYear() === currentYear);
      const wb = XLSX.utils.book_new();

      // Summary tab
      const sumRows = [
        ["KmSnap Pro - Tax Ready Report"], [`Tax Year: ${currentYear}`], ["Country: Canada"],
        ["Method: Actual Cost (Business-Use %)"], [`Generated: ${generated}`], [`Vehicle: ${data.vehicle.vehicle_name}`],
        [], [], ["KILOMETRES"], ["", "km"], ["Total Kilometres", totalKm], ["Business Kilometres", workKm],
        ["Personal Kilometres", personalKm], [], ["Business Use Percentage", pctVal], [], [],
        ["VEHICLE EXPENSES"], ["Category", "Actual ($)", "Deductible ($)"],
        ...CATEGORIES.map((c) => [c, report.byCategory[c].actual, report.byCategory[c].deductible]),
        [], ["TOTAL EXPENSES", report.totalExpenses, ""], ["ESTIMATED DEDUCTIBLE", "", report.totalDeductible],
        [], [], ["This report is for informational purposes only."], ["Consult a qualified tax professional before filing."], ["Generated by KmSnap Pro"],
      ];
      const wsSummary = XLSX.utils.aoa_to_sheet(sumRows);
      wsSummary["!cols"] = colW([28, 16, 16]);
      applyStyles(wsSummary, "A1", { font: { bold: true, sz: 16, color: { rgb: "3B82F6" } } });
      for (let i = 2; i <= 6; i++) applyStyles(wsSummary, `A${i}`, subHeaderStyle);
      applyStyles(wsSummary, "A9", sectionStyle);
      applyStyles(wsSummary, "A15", { font: { bold: true } }); applyStyles(wsSummary, "B15", pctStyle);
      applyStyles(wsSummary, "A18", sectionStyle);
      ["A19", "B19", "C19"].forEach((c) => applyStyles(wsSummary, c, colHeaderStyle));
      CATEGORIES.forEach((_, i) => { const r = 20 + i; applyStyles(wsSummary, `B${r}`, moneyStyle); applyStyles(wsSummary, `C${r}`, moneyStyle); });
      const totRow = 20 + CATEGORIES.length + 1;
      applyStyles(wsSummary, `A${totRow}`, totalRowStyle); applyStyles(wsSummary, `B${totRow}`, { ...totalRowStyle, ...moneyStyle });
      applyStyles(wsSummary, `A${totRow + 1}`, deductibleStyle); applyStyles(wsSummary, `C${totRow + 1}`, { ...deductibleStyle, ...moneyStyle });
      XLSX.utils.book_append_sheet(wb, wsSummary, "Summary");

      // Trip Log tab
      const tripRows = [
        ["KmSnap Pro - Trip Log"], [`Tax Year: ${currentYear}  |  ${yearLogs.length} trips logged`], [],
        ["Date", "Odometer", "Previous", "Distance (km)", "Trip Type", "Source"],
        ...yearLogs.map((l) => [l.date, l.odometer || 0, l.previous_odometer || "", l.distance_calculated || 0, (l.trip_type || "").charAt(0).toUpperCase() + (l.trip_type || "").slice(1), l.entry_source || ""]),
        [], ["Generated by KmSnap Pro"],
      ];
      const wsTrips = XLSX.utils.aoa_to_sheet(tripRows);
      wsTrips["!cols"] = colW([14, 14, 14, 16, 14, 12]);
      applyStyles(wsTrips, "A1", headerStyle); applyStyles(wsTrips, "A2", subHeaderStyle);
      ["A4", "B4", "C4", "D4", "E4", "F4"].forEach((c) => applyStyles(wsTrips, c, colHeaderStyle));
      XLSX.utils.book_append_sheet(wb, wsTrips, "Trip Log");

      // Expenses tab
      const expRows = [
        ["KmSnap Pro - Expense Detail"], [`Tax Year: ${currentYear}  |  ${yearExpenses.length} receipts`], [],
        ["Date", "Category", "Amount ($)", "Note"],
        ...yearExpenses.map((e) => [e.date, e.category, e.amount, e.note || ""]),
        [], ["TOTAL", "", yearExpenses.reduce((s, e) => s + e.amount, 0)], [], ["Generated by KmSnap Pro"],
      ];
      const wsExp = XLSX.utils.aoa_to_sheet(expRows);
      wsExp["!cols"] = colW([14, 16, 14, 30]);
      applyStyles(wsExp, "A1", headerStyle); applyStyles(wsExp, "A2", subHeaderStyle);
      ["A4", "B4", "C4", "D4"].forEach((c) => applyStyles(wsExp, c, colHeaderStyle));
      XLSX.utils.book_append_sheet(wb, wsExp, "Expenses");

      // Gap Recovery tab
      if (yearGaps.length > 0) {
        const gapRows = [
          ["KmSnap Pro - Gap Recovery"], [`Tax Year: ${currentYear}  |  ${yearGaps.length} gap allocations`], [],
          ["Period Start", "Period End", "Unlogged km", "Work km", "Personal km", "Method"],
          ...yearGaps.map((g) => [g.gap_start_date || "", g.gap_end_date || "", g.unlogged_km || 0, g.work_km || 0, g.personal_km || 0, (g.split_method || "").replace(/_/g, " ")]),
          [], ["Generated by KmSnap Pro"],
        ];
        const wsGap = XLSX.utils.aoa_to_sheet(gapRows);
        wsGap["!cols"] = colW([14, 14, 14, 12, 14, 16]);
        applyStyles(wsGap, "A1", headerStyle); applyStyles(wsGap, "A2", subHeaderStyle);
        ["A4", "B4", "C4", "D4", "E4", "F4"].forEach((c) => applyStyles(wsGap, c, colHeaderStyle));
        XLSX.utils.book_append_sheet(wb, wsGap, "Gap Recovery");
      }

      downloadXLSX(wb, `KmSnap_Tax_Report_${currentYear}.xlsx`);
      showToastMsg("Tax report downloaded");
    } catch (e) { showToastMsg("Export failed"); }
  };

  // ─── Screens ───
  if (!data.onboarded) {
    return (
      <div style={{ background: theme.bg, minHeight: "100vh", fontFamily: "'DM Sans', sans-serif", color: theme.text }}>
        <Onboarding onComplete={({ name, vehicleName, defaultType, initialOdometer }) => {
          update((d) => {
            d.onboarded = true; d.vehicle.vehicle_name = vehicleName; d.settings.default_trip_type = defaultType;
            d.logs.push({ log_id: genId(), user_id: "local", vehicle_id: d.vehicle.vehicle_id, odometer: initialOdometer, previous_odometer: null, distance_calculated: 0, entry_type: "start", entry_source: "manual", trip_type: defaultType, date: new Date().toISOString().split("T")[0], time: new Date().toISOString(), is_recovery: false, anomaly_confirmed: false });
          });
          setScreen("dashboard");
        }} />
      </div>
    );
  }

  const gap = detectGap();

  const renderDashboard = () => (
    <Page>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 0 8px" }}>
        <div>
          <h1 style={{ fontSize: 24, fontWeight: 800, color: theme.text, margin: 0, fontFamily: "'Space Mono', monospace" }}>KmSnap</h1>
          <p style={{ color: theme.textDim, fontSize: 12, margin: "2px 0 0" }}>{data.vehicle.vehicle_name}</p>
        </div>
        <button onClick={() => setScreen("settings")} style={{ ...baseBtn, background: theme.surface, color: theme.textMuted, padding: 10, borderRadius: 12, border: `1px solid ${theme.border}` }}><Icons.settings size={20} /></button>
      </div>
      <Card style={{ margin: "16px 0", display: "flex", justifyContent: "space-around", padding: "16px 12px" }}>
        <div style={{ textAlign: "center" }}>

          </div>
        ) : (
          <button onClick={() => setConfirmReset(true)}
            style={{ ...baseBtn, width: "100%", padding: "14px", fontSize: 14, background: `${theme.danger}15`, color: theme.danger, border: `1px solid ${theme.danger}30` }}>Reset All Data</button>
        )}
      </Card>
    </Page>
  );

  const screenMap = { dashboard: renderDashboard, log: renderLog, expense: renderExpense, reports: renderReports, settings: renderSettings };

  return (
    <div style={{ background: theme.bg, minHeight: "100vh", fontFamily: "'DM Sans', sans-serif", color: theme.text, position: "relative" }}>
      {screenMap[screen]?.()}
      {screen !== "log" && screen !== "expense" && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: theme.surface, borderTop: `1px solid ${theme.border}`, display: "flex", justifyContent: "space-around", padding: "8px 0", paddingBottom: "calc(8px + env(safe-area-inset-bottom, 0px))", zIndex: 100 }}>
          {[
            { id: "dashboard", icon: ({ size, color }) => <KmSnapIcon size={size} color={color} />, label: "Home" },
            { id: "log", icon: Icons.gauge, label: "Log" },
            { id: "expense", icon: Icons.camera, label: "Receipt" },
            { id: "reports", icon: Icons.chart, label: "Reports" },
            { id: "settings", icon: Icons.settings, label: "Settings" },
          ].map((tab) => {
            const active = screen === tab.id;
            return (
              <button key={tab.id} onClick={() => setScreen(tab.id)} style={{ ...baseBtn, flexDirection: "column", gap: 3, padding: "6px 16px", background: "none", color: active ? theme.accent : theme.textDim, fontSize: 10, fontWeight: active ? 700 : 500 }}>
                <tab.icon size={20} color={active ? theme.accent : theme.textDim} />
                {tab.label}
              </button>
            );
          })}
        </div>
      )}
      {showVoice && <VoiceLogger onResult={handleVoiceResult} onClose={() => setShowVoice(false)} />}
      {showPaywall && <PaywallModal onClose={() => setShowPaywall(false)} onUpgrade={handleUpgrade} />}
      {showGap && <GapRecovery gapKm={quickLogState.odometer && prevOdometer ? parseInt(quickLogState.odometer) - prevOdometer : 0} gapDays={showGap.days} lastDate={showGap.lastDate} onSave={handleGapSave} onClose={() => setShowGap(null)} />}
      {toast && <div style={{ position: "fixed", top: 40, left: "50%", transform: "translateX(-50%)", background: theme.success, color: "#fff", padding: "12px 28px", borderRadius: 12, fontSize: 14, fontWeight: 600, zIndex: 2000, boxShadow: "0 8px 30px rgba(0,0,0,0.4)", animation: "slideDown 0.2s ease" }}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KMSnap />);
</script>

</body>
</html>
